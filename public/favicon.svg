<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield Polygon -->
  <polygon points="100,10 185,45 160,150 100,190 40,150 15,45" fill="url(#shieldGrad)" stroke="url(#cyberGrad)" stroke-width="4" filter="url(#neonGlow)" />
  
  <!-- Inner Shield Border -->
  <polygon points="100,24 170,54 148,142 100,176 52,142 30,54" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Cyber Wings / Accents -->
  <path d="M 40,75 L 75,95 L 45,115 Z" fill="#8b5cf6" opacity="0.8" />
  <path d="M 160,75 L 125,95 L 155,115 Z" fill="#ff0080" opacity="0.8" />

  <!-- Stylized Cyber "K" Crest -->
  <path d="M 78,55 L 94,55 L 94,145 L 78,145 Z" fill="url(#cyberGrad)" />
  <path d="M 94,100 L 132,55 L 150,55 L 110,105 L 154,145 L 134,145 L 94,105 Z" fill="url(#cyberGrad)" />

  <!-- Lightning / Flare Details -->
  <polygon points="100,32 105,48 95,48" fill="#00e5ff" />
  <circle cx="100" cy="100" r="3" fill="#ffffff" />
  
  <!-- Subtle Crosshairs / Gaming Grid -->
  <line x1="20" y1="100" x2="35" y2="100" stroke="#00e5ff" stroke-width="2" />
  <line x1="165" y1="100" x2="180" y2="100" stroke="#00e5ff" stroke-width="2" />
</svg>
